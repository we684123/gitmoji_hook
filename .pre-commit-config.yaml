repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer

  # Consume this hook from its published repository, just like downstream users.
  # The release tag is updated when a new hook version is published.
  - repo: https://github.com/we684123/gitmoji_hook
    rev: v0.2.0
    hooks:
      - id: gitmoji-merge-commit-msg
